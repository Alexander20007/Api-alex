<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Clube da Luta — Teste</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 900px;
    width: 100%;
  }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 24px;
    background: linear-gradient(135deg, #00d2ff, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .header p {
    color: #888;
    font-size: 13px;
  }
  .player-box {
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 16/9;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    position: relative;
  }
  video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
  }
  .loading {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
    color: #00d2ff;
    font-size: 14px;
  }
  .loading.hide { display: none; }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top-color: #00d2ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    margin-top: 20px;
    padding: 14px 20px;
    border-radius: 12px;
    background: #1a1a1a;
    font-size: 13px;
    text-align: center;
    color: #888;
  }
  .status.ok { color: #4ade80; background: #1a3a1a; }
  .status.err { color: #f87171; background: #3a1a1a; }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    background: linear-gradient(135deg, #00d2ff, #7c3aed);
    border: none;
    color: #fff;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎬 Clube da Luta</h1>
    <p>Teste de streaming</p>
  </div>

  <div class="player-box">
    <video id="video" controls playsinline crossorigin="anonymous"></video>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Carregando...</div>
    </div>
  </div>

  <div class="status" id="status">Pronto para assistir</div>

  <div class="controls">
    <button onclick="assistir()">▶ Assistir Clube da Luta</button>
    <button onclick="parar()" style="background: #333;">⏹ Parar</button>
  </div>
</div>

<script>
const API = 'https://api-alex-jney.onrender.com';
const video = document.getElementById('video');
const loading = document.getElementById('loading');
const statusEl = document.getElementById('status');
let hls = null;

function setStatus(msg, classe = '') {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + classe;
}

async function assistir() {
  if (hls) { hls.destroy(); hls = null; }
  video.src = '';
  loading.classList.remove('hide');
  setStatus('Buscando stream...');

  try {
    const res = await fetch(`${API}/extract?tmdb_id=550&type=movie`);
    const data = await res.json();

    if (!data.success) {
      setStatus('❌ ' + (data.error || 'Erro'), 'err');
      loading.classList.add('hide');
      return;
    }

    setStatus('✅ Stream obtido! Carregando player...');

    const cookiesParam = data.cookies ? `&cookies=${encodeURIComponent(data.cookies)}` : '';
    const proxyUrl = `${API}/proxy?url=${encodeURIComponent(data.hlsUrl)}${cookiesParam}`;

    if (Hls.isSupported()) {
      hls = new Hls({
        maxBufferLength: 120,
        maxMaxBufferLength: 600,
        maxBufferSize: 60 * 1000 * 1000,
        backBufferLength: 90,
      });
      hls.loadSource(proxyUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, (ev, d) => {
        loading.classList.add('hide');
        setStatus(`🎬 ${d.levels.length} qualidades · Tocando`, 'ok');
        video.play().catch(() => {});
      });

      hls.on(Hls.Events.ERROR, (ev, d) => {
        if (d.fatal) {
          setStatus('❌ Erro: ' + d.details, 'err');
          loading.classList.add('hide');
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = proxyUrl;
      video.addEventListener('loadedmetadata', () => {
        loading.classList.add('hide');
        setStatus('🎬 Tocando', 'ok');
        video.play().catch(() => {});
      });
    }
  } catch (err) {
    setStatus('❌ ' + err.message, 'err');
    loading.classList.add('hide');
  }
}

function parar() {
  if (hls) { hls.destroy(); hls = null; }
  video.pause();
  video.src = '';
  loading.classList.remove('hide');
  setStatus('Pronto para assistir');
}

// Auto-start
window.addEventListener('load', () => {
  setTimeout(assistir, 500);
});
</script>
</body>
</html>
